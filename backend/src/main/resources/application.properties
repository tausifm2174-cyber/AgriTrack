# ==============================================================================
# AgriTrack: Smart Farm Management System - Spring Boot Backend Configuration
# Phase 13: Spring Boot Backend + MySQL Foundation
# ==============================================================================

# Application Metadata
spring.application.name=agritrack-backend

# Server Configuration
# Runs on port 8080 by default (overridable via SERVER_PORT environment variable)
server.port=${SERVER_PORT:8080}

# Application Base Context Path
# Matches frontend API client configuration: http://localhost:8080/api/v1
server.servlet.context-path=/api/v1

# Datasource Configuration (MySQL 8.0)
# Overridable via DB_URL, DB_USERNAME, DB_PASSWORD environment variables
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/agritrack_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:agritrack_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=5000
# initialization-fail-timeout: -1 ensures foundation startup/health-check continues if DB credentials are not yet provided
spring.datasource.hikari.initialization-fail-timeout=-1

# JPA / Hibernate Configuration
# ddl-auto=none ensures Hibernate never modifies database schema automatically
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Prevent Hibernate from blocking on JDBC metadata on startup
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# CORS Allowed Origins
# Configurable via FRONTEND_ORIGIN environment variable (comma-separated if multiple)
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}

# JWT Authentication Configuration
# Overridable via JWT_SECRET and JWT_EXPIRATION_MS environment variables
# Do NOT store production secrets here or commit them to version control.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Weather Integration & Caching Configuration (Phase 20)
app.weather.cache-ttl-minutes=${WEATHER_CACHE_TTL_MINUTES:30}
app.weather.openweather.api-key=${OPENWEATHER_API_KEY:}
app.weather.openweather.base-url=${OPENWEATHER_BASE_URL:https://api.openweathermap.org/data/2.5}
app.weather.openweather.timeout-ms=${OPENWEATHER_TIMEOUT_MS:5000}
